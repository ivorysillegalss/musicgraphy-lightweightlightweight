<!DOCTYPE html>
<!-- ============================================================
  Musicgraphy 2.0 · 看板「每日日报」页（2026-11-14 用户裁决新开，
  「在看板中新开一页记录每日的日报」；登记于《看板更新协议.md》§1/§7）
  安全姿态与主看板一致：单目录静态件、零外部请求（无 CDN/字体/图标）、
  零 eval、零 innerHTML——日报数据经 textContent 注入，无注入面。
  日报更新 = 只改 daily-reports.js（每日收口时头部追加当日条目）；
  本文件与 daily.js 为稳定件勿改。
  视觉 token 来源：07-前端设计包/design-system/musicgraphy/MASTER.md
  （暖墨 + 琥珀注记于奶油纸面；红仅 destructive）。
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musicgraphy 2.0 每日日报</title>
<style>
  :root {
    --color-background: #FFFBEB;   /* 奶油纸面 */
    --color-card: #FFFFFF;
    --color-foreground: #1C1917;   /* 暖墨 */
    --color-primary: #292524;
    --color-on-primary: #FAF6EE;
    --color-secondary: #78716C;    /* 钢墨 */
    --color-accent: #D97706;       /* 琥珀注记（大字/装饰） */
    --color-accent-text: #B45309;  /* 琥珀小字（AA） */
    --color-muted: #F7F3EA;
    --color-muted-foreground: #57534E;
    --color-border: #E9E2D2;
    --color-destructive: #DC2626;  /* 红仅 destructive */
    --color-ok: #16A34A;
    --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-background);
    color: var(--color-foreground);
    font-family: var(--font-body);
    font-size: 14px; line-height: 1.55;
    padding: 32px 24px 64px;
    max-width: 1200px; margin: 0 auto;
  }
  header { margin-bottom: 20px; }
  header h1 {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 700; letter-spacing: .01em;
  }
  header .line { color: var(--color-muted-foreground); margin-top: 4px; }
  header .purpose { color: var(--color-muted-foreground); font-size: 12px; margin-top: 4px; }
  .board-nav { margin-top: 8px; }
  .board-nav a {
    color: var(--color-accent-text); font-size: 13px; text-decoration: none;
    border-bottom: 1px dashed var(--color-border);
  }

  .daily {
    background: var(--color-card); border: 1px solid var(--color-border);
    border-radius: 10px; padding: 20px 24px; margin-top: 22px;
  }
  .daily-head { border-bottom: 2px solid var(--color-primary); padding-bottom: 10px; margin-bottom: 12px; }
  .daily-date {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    color: var(--color-on-primary); background: var(--color-primary);
    border-radius: 6px; padding: 2px 10px; display: inline-block; letter-spacing: .06em;
  }
  .daily-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-top: 8px; }
  .daily-summary { font-size: 13px; color: var(--color-muted-foreground); margin-top: 10px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin: 14px 0 4px; }
  .stat {
    background: var(--color-muted); border: 1px solid var(--color-border);
    border-radius: 8px; padding: 8px 12px;
  }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--color-accent-text); letter-spacing: .04em; }
  .stat-value { font-size: 12px; font-family: var(--font-mono); color: var(--color-foreground); margin-top: 2px; word-break: break-all; }

  .sec { margin-top: 18px; }
  .sec > h3 {
    font-family: var(--font-display); font-size: 16px; font-weight: 700;
    border-bottom: 1px solid var(--color-border); padding-bottom: 5px; margin-bottom: 10px;
  }
  .sec ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .sec ul li {
    font-size: 13px; color: var(--color-foreground);
    background: var(--color-card); border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-accent); border-radius: 6px; padding: 8px 12px;
  }
  .timeline { display: flex; flex-direction: column; gap: 6px; }
  .tl-row { display: flex; gap: 12px; align-items: baseline; }
  .tl-time {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    color: var(--color-accent-text); white-space: nowrap; min-width: 58px;
  }
  .tl-text { font-size: 13px; color: var(--color-foreground); }
  .tl-row + .tl-row { border-top: 1px dashed var(--color-border); padding-top: 6px; }

  .evidence {
    margin-top: 18px; background: var(--color-muted); border: 1px dashed var(--color-border);
    border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .ev-row { font-size: 12px; font-family: var(--font-mono); color: var(--color-muted-foreground); }
  .ev-key { color: var(--color-accent-text); font-weight: 700; margin-right: 6px; }

  footer { margin-top: 36px; font-size: 11px; color: var(--color-muted-foreground);
    border-top: 1px solid var(--color-border); padding-top: 10px; }
</style>
</head>
<body>
  <header>
    <h1 id="proj">Musicgraphy 2.0 · 每日日报</h1>
    <div class="line" id="line"></div>
    <div class="purpose" id="purpose"></div>
    <div class="board-nav"><a href="index.html">← 返回实现进度看板（卡片终态）</a></div>
  </header>

  <main id="daily"></main>

  <footer>
    每日日报 = 当天做了什么 / 裁决了什么 / 移交了什么（与进度看板互为表里）。
    更新 = 只改 <code>daily-reports.js</code>（每日收口时头部追加当日条目，历史条目只增不改），
    协议见同目录《看板更新协议.md》。本页零外部请求、零注入面；双击即可打开。
  </footer>

  <script src="daily-reports.js"></script>
  <script src="daily.js"></script>
</body>
</html>
